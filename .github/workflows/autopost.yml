name: 24/7 Social Autopost Scheduler

on:
  schedule:
    - cron: '*/15 * * * *' # Wakes up every 15 minutes, 24/7
  workflow_dispatch: # Allows manual trigger anytime with 1 click

jobs:
  run-autopost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./functions
        run: npm install

      - name: Run Autopost Engine
        working-directory: ./functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run autopost
